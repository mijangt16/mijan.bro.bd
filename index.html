<body>

      <button id="loginBtn" class="auth-btn" type="button">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335"
            d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/>
          <path fill="#4285F4"
            d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/>

          <path fill="#34A853"

        </svg>

      <div id="userInfo" style="display: none">

    <p>Practice Bangla typing and improve your speed.</p>

    <a class="typing-btn" href="https://mijan.bro.bd/notes">
      Notes
    </a>
  </main>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    import {
      getFirestore,
      doc,
      setDoc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const app = initializeApp({
      apiKey: "AIzaSyBf3cdb7qdvlNXJlkpeXwuwaUjBr3dlAgA",
      authDomain: "mijanbrobddatasaver.firebaseapp.com",
      projectId: "mijanbrobddatasaver",
      storageBucket: "mijanbrobddatasaver.firebasestorage.app",
      messagingSenderId: "601428881237",
      appId: "1:601428881237:web:2c7046b4d0a3dafb1789dc"
    });

    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const userInfo = document.getElementById("userInfo");
    const userName = document.getElementById("userName");
    const userPhoto = document.getElementById("userPhoto");
    const authMsg = document.getElementById("authMsg");

    let currentUser = null;

    // Save data to Firebase Firestore.
    window.saveData = async function (key, value) {
      if (!currentUser) {
        throw new Error("Please sign in first.");
      }

      await setDoc(
        doc(db, "users", currentUser.uid, "data", key),
        { value }
      );
    };

    // Load data from Firebase Firestore.
    window.loadData = async function (key, fallback = null) {
      if (!currentUser) {
        return fallback;
      }

      const snapshot = await getDoc(
        doc(db, "users", currentUser.uid, "data", key)
      );

      return snapshot.exists()
        ? snapshot.data().value
        : fallback;
    };

    loginBtn.addEventListener("click", async () => {
      authMsg.textContent = "";

      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        if (err.code === "auth/unauthorized-domain") {
          authMsg.textContent =
            "This domain is not authorized. Add it in Firebase Authentication > Settings > Authorized domains.";
        } else if (
          err.code !== "auth/popup-closed-by-user" &&
          err.code !== "auth/cancelled-popup-request"
        ) {
          authMsg.textContent = "Sign-in failed: " + err.code;
        }
      }
    });

    logoutBtn.addEventListener("click", async () => {
      authMsg.textContent = "";

      try {
        await signOut(auth);
      } catch (err) {
        authMsg.textContent = "Sign-out failed: " + err.code;
      }
    });

    onAuthStateChanged(auth, (user) => {
      currentUser = user;

      loginBtn.style.display = user ? "none" : "";
      userInfo.style.display = user ? "flex" : "none";

      if (user) {
        userName.textContent = user.displayName || user.email || "User";

        if (user.photoURL) {
          userPhoto.src = user.photoURL;
          userPhoto.style.display = "";
        } else {
          userPhoto.style.display = "none";
        }
      } else {
        userName.textContent = "";
        userPhoto.removeAttribute("src");
      }

      document.dispatchEvent(
        new CustomEvent("user-ready", {
          detail: user
        })
      );
    });
  </script>
</body>
</html>
