<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prep Notebook</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f7f8;--card:#fff;--ink:#1d2530;--mute:#6b7683;--line:#e2e7ea;--acc:#1f7a7a;--acc-soft:#e3f2f1;--warn:#b4531f;--warn-soft:#fbeee4;
--c-Bangla:#c0475a;--c-English:#3b6fb6;--c-Math:#7a52b3;--c-GK:#1f7a7a;--c-Graphic:#b7791f;--c-Other:#6b7683;
--paper:#fffef9;--rule:#d9e6ef;--margin:#efb0b0;--desk:#dfe7ec;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181d;--card:#27303a;--ink:#e8edf1;--mute:#93a0ac;--line:#2c353e;--acc:#4fb3b0;--acc-soft:#1b3333;--warn:#f0a070;--warn-soft:#3a2a1e;--c-Bangla:#e07388;--c-English:#6f9de0;--c-Math:#a98be0;--c-GK:#4fb3b0;--c-Graphic:#e0b050;--c-Other:#93a0ac;--paper:#20272e;--rule:#2c3944;--margin:#6e3b45;--desk:#12161a}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--desk);color:var(--ink);font-family:"Hind Siliguri",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.55}
.wrap{position:relative;max-width:760px;margin:20px auto;padding:30px 24px 96px 70px;background-color:var(--paper);background-image:linear-gradient(90deg,transparent 52px,var(--margin) 52px,var(--margin) 54px,transparent 54px),repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--rule) 31px,var(--rule) 32px);background-position:0 0,0 12px;border-radius:8px;box-shadow:0 2px 4px rgba(20,30,40,.08),0 18px 40px rgba(20,30,40,.12)}
.wrap::before{content:"";position:absolute;left:14px;top:26px;bottom:26px;width:24px;background:radial-gradient(circle at 12px 12px,var(--desk) 0 6px,var(--mute) 6px 8px,transparent 8.5px) 0 0/24px 44px repeat-y}
@media (max-width:600px){.wrap{margin:10px 8px;padding:24px 14px 96px 46px;background-image:linear-gradient(90deg,transparent 32px,var(--margin) 32px,var(--margin) 34px,transparent 34px),repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--rule) 31px,var(--rule) 32px)}.wrap::before{display:none}}
h1{font-family:"Caveat","Hind Siliguri",cursive;font-size:36px;font-weight:600;margin:0;line-height:1.2}
.sub{color:var(--mute);margin:0;font-size:14px}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus,button:focus-visible{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px}
.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:500;padding:10px 20px;border-radius:11px}
.primary:hover{filter:brightness(1.08)}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:13px;background:var(--acc);color:#fff;display:grid;place-items:center;flex-shrink:0}
.menu{position:relative}
.acct{width:42px;height:42px;padding:0;display:grid;place-items:center;border-radius:50%;color:var(--mute);overflow:hidden;flex-shrink:0}
.acct:hover{color:var(--acc);border-color:var(--acc)}
.acct img{width:100%;height:100%;object-fit:cover;display:block}
.pop{position:absolute;right:0;top:50px;z-index:20;min-width:220px;max-width:280px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 14px 36px rgba(20,30,40,.16)}
.pop[hidden]{display:none}
.pop button{display:block;width:100%;text-align:left;border:none;background:none;padding:10px 12px;border-radius:9px}
.pop button:hover{background:var(--acc-soft);color:var(--acc)}
.pop small{display:block;padding:8px 12px 6px;margin-bottom:4px;border-bottom:1px solid var(--line);color:var(--mute);font-size:13px;overflow-wrap:anywhere}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px;align-items:center}
.chip{padding:5px 12px;font-size:14px;border-radius:99px;background:var(--card);color:var(--mute)}
.chip:hover{border-color:var(--acc);color:var(--acc)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#search{margin-bottom:12px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 10px;color:var(--mute);font-size:14px}
.meta select{width:auto;padding:4px 8px;font-size:14px}
.item{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--cc);border-radius:14px;padding:16px 18px;margin-bottom:10px;transition:box-shadow .15s}
.item:hover{box-shadow:0 8px 22px rgba(20,30,40,.08)}
.item.done{opacity:.6}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.num{display:inline-block;min-width:34px;text-align:center;font-size:12px;font-weight:600;color:var(--cc);border:1px solid var(--cc);border-radius:99px;padding:0 8px;margin-right:8px}
.tag{font-size:13px;color:var(--cc);font-weight:500}
.flag{font-size:12px;background:var(--warn-soft);color:var(--warn);padding:1px 8px;border-radius:99px;margin-left:8px;font-weight:500}
.q{font-weight:600;font-size:17px;margin:6px 0 2px;white-space:pre-wrap;overflow-wrap:anywhere}
.a{white-space:pre-wrap;overflow-wrap:anywhere}
.note{margin-top:8px;font-size:14px;color:var(--mute);white-space:pre-wrap;overflow-wrap:anywhere}
.acts{display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.acts button{border:none;background:none;color:var(--mute);padding:4px 8px;font-size:14px}
.acts button:hover{color:var(--acc)}
.acts .del:hover{color:var(--warn)}
.acts .heart{font-size:20px;line-height:1}.acts .heart.on{color:#d6455d}
.empty{text-align:center;color:var(--mute);padding:44px 16px;border:1px dashed var(--line);border-radius:16px;background:var(--card)}
.pic{display:block;max-width:100%;max-height:340px;margin-top:12px;border-radius:10px;border:1px solid var(--line);object-fit:contain}
.pv{display:flex;align-items:center;gap:12px;margin-top:10px}
.pv img{height:72px;max-width:50%;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.gh{font-family:"Caveat","Hind Siliguri",cursive;font-size:26px;font-weight:600;margin:18px 0 8px;color:var(--cc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{margin:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tile img{display:block;width:100%;height:130px;object-fit:cover}
.tile figcaption{padding:8px 10px;font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pager{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin:20px 0 4px}
.pg{min-width:38px;padding:6px 10px;border-radius:10px}
.pg.on{background:var(--acc);border-color:var(--acc);color:#fff}
.pg:disabled{opacity:.4;cursor:default}
.dots{color:var(--mute);padding:0 2px}
.pinfo{text-align:center;color:var(--mute);font-size:13px;margin-top:6px}
.fab{position:fixed;right:max(18px,calc(50% - 380px - 10px));bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:8px;padding:12px 20px;border-radius:99px;background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600;box-shadow:0 10px 26px rgba(20,30,40,.3);transition:transform .25s,opacity .25s}
.fab:hover{filter:brightness(1.08)}
.fab.hide{transform:translateY(90px);opacity:0;pointer-events:none}
.ov{position:fixed;inset:0;z-index:60;background:rgba(10,16,22,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.ov[hidden]{display:none}
.modal{background:var(--card);border-radius:18px;width:100%;max-width:520px;max-height:calc(100% - 8px);overflow:auto;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.mh h2{margin:0;font-family:"Caveat","Hind Siliguri",cursive;font-size:30px;font-weight:600}
.x{border:none;background:none;font-size:26px;line-height:1;padding:2px 8px;color:var(--mute)}
.x:hover{color:var(--ink)}
.btns{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;z-index:80}
.toast[hidden]{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="brand">
      <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/><path d="M9 8h6"/></svg></div>
      <div><h1>Prep Notebook</h1><p class="sub">Save what feels hard. Read it again.</p></div>
    </div>
    <div class="menu">
      <button class="acct" id="acct" aria-label="Account" aria-expanded="false"></button>
      <div class="pop" id="pop" hidden>
        <small id="who"></small>
        <button id="out">Sign out</button>
      </div>
    </div>
  </div>

  <div class="bar" id="chips"></div>
  <input id="search" placeholder="Search your notes">
  <div class="meta"><span id="count"></span><span>Per page <select id="ps"><option>5</option><option selected>10</option><option>20</option><option>50</option></select></span></div>
  <div id="list"></div>
  <div id="pager" class="pager"></div>
  <div id="pinfo" class="pinfo"></div>
</div>

<button class="fab" id="fab" aria-label="Add question"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add question</button>

<div class="ov" id="ov" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
    <div class="mh"><h2 id="mt">Add question</h2><button class="x" id="mx" aria-label="Close">&times;</button></div>
    <label for="cat">Category</label>
    <select id="cat"></select>
    <label for="q">Question, word or quote</label>
    <textarea id="q" placeholder="What did you not know?"></textarea>
    <label for="a">Answer or meaning</label>
    <textarea id="a" placeholder="Write the correct answer (you can paste an image here with Ctrl+V)"></textarea>
    <label for="n">Note to self (optional)</label>
    <input id="n" placeholder="What should you read again?">
    <label>Image (optional)</label>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><button type="button" id="addimg">Add image</button><input type="file" id="imgfile" accept="image/*" hidden><span id="imgmsg" style="font-size:14px;color:var(--mute)"></span></div>
    <div id="prev"></div>
    <div class="btns">
      <button id="cancel">Cancel</button>
      <button class="primary" id="save">Add to notebook</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
var firebaseConfig={
  apiKey:"AIzaSyBf3cdb7qdvlNXJlkpeXwuwaUjBr3dlAgA",
  authDomain:"mijanbrobddatasaver.firebaseapp.com",
  projectId:"mijanbrobddatasaver",
  storageBucket:"mijanbrobddatasaver.firebasestorage.app",
  messagingSenderId:"601428881237",
  appId:"1:601428881237:web:2c7046b4d0a3dafb1789dc",
  measurementId:"G-PHRHDNHJ7Q"
};
firebase.initializeApp(firebaseConfig);
var auth=firebase.auth();
var db=firebase.firestore();
try{db.enablePersistence({synchronizeTabs:true}).catch(function(){})}catch(e){}

var CATS=["Bangla","English","Math","GK"];
var OLD_KEY="prep-notebook-v1",items=[],filter="All",editId=null,confirmId=null,page=1,perPage=10,numMap={};
var user=null,col=null,unsub=null,firstSnap=true,curImg="";
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function toast(m){var t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},2600)}

function clean(it){return JSON.parse(JSON.stringify(it))}
function fail(e){toast("Could not save to Firebase ("+(e&&e.code||"error")+")")}
function saveItem(it){if(!col)return;if(!it.ts)it.ts=Date.now();return col.doc(it.id).set(clean(it)).catch(fail)}
function removeItem(id){if(!col)return;return col.doc(id).delete().catch(fail)}

/* ---------- account ---------- */
var PERSON='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>';
function drawAcct(){
  var b=$("acct");
  if(!user){b.innerHTML=PERSON;b.title="Sign in";b.setAttribute("aria-label","Sign in");$("pop").hidden=true;return}
  b.title=user.email||"Account";b.setAttribute("aria-label","Account");
  if(user.photoURL){b.innerHTML='<img src="'+esc(user.photoURL)+'" alt="" referrerpolicy="no-referrer">'}
  else{b.innerHTML='<span style="font-weight:600;color:var(--acc)">'+esc(((user.displayName||user.email||"?").charAt(0)).toUpperCase())+'</span>'}
  $("who").textContent=(user.displayName?user.displayName+"\n":"")+(user.email||"");
  $("who").style.whiteSpace="pre-line";
}
function signIn(){
  auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function(e){
    if(e&&e.code==="auth/popup-closed-by-user"||e&&e.code==="auth/cancelled-popup-request")return;
    toast("Sign-in failed ("+(e&&e.code||"error")+")");
  });
}
$("acct").onclick=function(){
  if(!user){signIn();return}
  var h=$("pop").hidden;$("pop").hidden=!h;this.setAttribute("aria-expanded",String(h));
};
$("out").onclick=function(){$("pop").hidden=true;auth.signOut()};
document.addEventListener("click",function(e){if(!e.target.closest(".menu")){$("pop").hidden=true}});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){$("pop").hidden=true;if(!$("ov").hidden)closeModal()}});

auth.onAuthStateChanged(function(u){
  user=u;
  if(unsub){unsub();unsub=null}
  items=[];reset();closeModal();page=1;
  drawAcct();
  if(u){col=db.collection("users").doc(u.uid).collection("notes");firstSnap=true;startSync()}
  else{col=null;render()}
});

function startSync(){
  unsub=col.onSnapshot(function(s){
    items=s.docs.map(function(d){return d.data()}).sort(function(a,b){return (b.ts||0)-(a.ts||0)});
    render();
    if(firstSnap){firstSnap=false;migrateOld(s)}
  },function(e){toast("Firebase error: "+(e&&e.code||"error"))});
}

/* one-time copy of older notes (browser local storage, and the earlier shared "notes" collection) into this account */
function migrateOld(snap){
  var flag="prep-migrated-"+user.uid;
  try{if(localStorage.getItem(flag))return}catch(e){}
  var have={};snap.docs.forEach(function(d){have[d.id]=1});
  var old=[];
  try{old=JSON.parse(localStorage.getItem(OLD_KEY)||"[]")}catch(e){}
  if(!Array.isArray(old))old=[];
  db.collection("notes").get().catch(function(){return null}).then(function(legacy){
    if(legacy)legacy.docs.forEach(function(d){old.push(d.data())});
    var now=Date.now(),jobs=[],n=0;
    old.forEach(function(x,i){
      if(x&&x.id&&x.q&&!have[x.id]){have[x.id]=1;x.ts=x.ts||(now-i);n++;jobs.push(col.doc(x.id).set(clean(x)))}
    });
    return Promise.all(jobs).then(function(){
      try{localStorage.setItem(flag,"1");localStorage.removeItem(OLD_KEY)}catch(e){}
      if(n)toast(n+" earlier notes added to your account");
    });
  }).catch(fail);
}

/* ---------- notebook ---------- */
$("cat").innerHTML=CATS.map(function(c){return '<option>'+c+'</option>'}).join("");

function chips(){
  var all=["All"].concat(CATS,["Loved","Images","Learned"]);
  $("chips").innerHTML=all.map(function(c){return '<button class="chip'+(c===filter?' on':'')+'" data-f="'+c+'">'+c+'</button>'}).join("");
}
$("chips").onclick=function(e){var f=e.target.getAttribute("data-f");if(f){filter=f;page=1;render()}};
$("search").oninput=function(){page=1;render()};
$("ps").onchange=function(){perPage=+this.value;page=1;render()};

/* permanent question numbers: oldest question = 1 */
function numbers(){
  numMap={};
  items.slice().sort(function(a,b){return (a.ts||0)-(b.ts||0)}).forEach(function(it,i){numMap[it.id]=i+1});
}

function pageList(cur,total){
  if(total<=7){var a=[];for(var i=1;i<=total;i++)a.push(i);return a}
  var set={1:1,2:1};set[total]=1;set[total-1]=1;set[cur]=1;set[cur-1]=1;set[cur+1]=1;
  var nums=Object.keys(set).map(Number).filter(function(n){return n>=1&&n<=total}).sort(function(a,b){return a-b});
  var out=[],prev=0;
  nums.forEach(function(n){if(prev&&n-prev>1)out.push("…");out.push(n);prev=n});
  return out;
}
function drawPager(total,pages){
  var p=$("pager");
  if(pages<=1){p.innerHTML="";$("pinfo").textContent="";return}
  var h='<button class="pg" data-p="prev"'+(page===1?' disabled':'')+'>&larr; Prev</button>';
  pageList(page,pages).forEach(function(n){h+=n==="…"?'<span class="dots">…</span>':'<button class="pg'+(n===page?' on':'')+'" data-p="'+n+'"'+(n===page?' aria-current="page"':'')+'>'+n+'</button>'});
  h+='<button class="pg" data-p="next"'+(page===pages?' disabled':'')+'>Next &rarr;</button>';
  p.innerHTML=h;
  $("pinfo").textContent="Page "+page+" of "+pages;
}
$("pager").onclick=function(e){
  var b=e.target.closest("[data-p]");if(!b||b.disabled)return;
  var v=b.getAttribute("data-p");
  page=v==="prev"?page-1:v==="next"?page+1:+v;
  render();
  $("count").scrollIntoView({behavior:"smooth",block:"start"});
};

function render(){
  chips();numbers();
  if(!user){
    $("count").textContent="";$("pager").innerHTML="";$("pinfo").textContent="";
    $("list").innerHTML='<div class="empty">Sign in to see and save your notes.<br><button class="primary" id="si" style="margin-top:12px">Sign in with Google</button></div>';
    $("si").onclick=signIn;return;
  }
  var s=$("search").value.trim().toLowerCase();
  var out=items.filter(function(i){
    if(filter==="Learned"){if(i.review)return false}
    else if(filter==="Loved"){if(!i.love)return false}
    else if(filter==="Images"){if(!i.img)return false}
    else{if(!i.review)return false;if(filter!=="All"&&i.cat!==filter)return false}
    return !s||((i.q||"")+" "+(i.a||"")+" "+(i.n||"")).toLowerCase().indexOf(s)>-1;
  });
  var total=out.length,pages=Math.max(1,Math.ceil(total/perPage));
  if(page>pages)page=pages;if(page<1)page=1;
  var from=(page-1)*perPage,slice=out.slice(from,from+perPage);
  $("count").textContent=total?("Showing "+(from+1)+"–"+(from+slice.length)+" of "+total+(total===1?" note":" notes")):"0 notes";
  drawPager(total,pages);
  if(!total){
    $("list").innerHTML=items.length?'<div class="empty">No notes match this view.</div>':'<div class="empty">No questions yet.<br><button class="primary" id="addq" style="margin-top:12px">Add a question</button></div>';
    var b=$("addq");if(b)b.onclick=openAdd;return;
  }
  if(filter==="Images"){
    $("list").innerHTML=CATS.map(function(c){var g=slice.filter(function(i){return i.cat===c});if(!g.length)return"";
      return '<h2 class="gh" style="--cc:var(--c-'+c+')">'+c+'</h2><div class="grid">'+g.map(function(i){return '<figure class="tile"><img src="'+esc(i.img)+'" alt=""><figcaption>Q'+numMap[i.id]+' · '+esc(i.q)+'</figcaption></figure>'}).join("")+'</div>'}).join("");
    return;
  }
  $("list").innerHTML=slice.map(function(i){
    return '<div class="item'+(i.review?'':' done')+'" style="--cc:var(--c-'+i.cat+')">'+
    '<div class="top"><div><span class="num">Q'+numMap[i.id]+'</span><span class="tag">'+i.cat+'</span>'+(i.review?'':'<span class="flag">Learned</span>')+'</div>'+
    '<div class="acts"><button class="heart'+(i.love?' on':'')+'" data-a="love" data-id="'+i.id+'" aria-label="Love">'+(i.love?'♥':'♡')+'</button><button data-a="toggle" data-id="'+i.id+'">'+(i.review?'Mark learned':'Read again')+'</button>'+
    '<button data-a="edit" data-id="'+i.id+'">Edit</button><button class="del" data-a="del" data-id="'+i.id+'">'+(confirmId===i.id?'Tap again to delete':'Delete')+'</button></div></div>'+
    '<div class="q">'+esc(i.q)+'</div>'+
    (i.a?'<div class="a">'+esc(i.a)+'</div>':'')+
    (i.n?'<div class="note">'+esc(i.n)+'</div>':'')+(i.img?'<img class="pic" src="'+esc(i.img)+'" alt="">':'')+'</div>';
  }).join("");
}

$("list").onclick=function(e){
  var a=e.target.getAttribute("data-a"),id=e.target.getAttribute("data-id");
  if(!a)return;if(a!=="del")confirmId=null;
  var it=items.filter(function(x){return x.id===id})[0];if(!it)return;
  if(a==="love"){it.love=!it.love;saveItem(it);render()}
  if(a==="toggle"){it.review=!it.review;saveItem(it);render();toast(it.review?"Moved back to your notebook":"Moved to Learned")}
  if(a==="del"){if(confirmId===id){confirmId=null;removeItem(id);items=items.filter(function(x){return x.id!==id});render();toast("Note deleted")}else{confirmId=id;render();setTimeout(function(){if(confirmId===id){confirmId=null;render()}},3000)}}
  if(a==="edit"){editId=id;$("cat").value=it.cat;$("q").value=it.q;$("a").value=it.a||"";$("n").value=it.n||"";setImg(it.img||"");
    $("mt").textContent="Edit question #"+numMap[it.id];$("save").textContent="Save changes";openModal()}
};

/* ---------- popup ---------- */
function focusQ(){var q=$("q");try{q.focus({preventScroll:true})}catch(e){q.focus()}try{q.setSelectionRange(q.value.length,q.value.length)}catch(e){}}
function openModal(){
  document.body.style.overflow="hidden";$("ov").hidden=false;
  focusQ();
  requestAnimationFrame(focusQ);
  setTimeout(focusQ,60);
  setTimeout(focusQ,200);
}
function closeModal(){$("ov").hidden=true;document.body.style.overflow="";$("imgmsg").textContent=""}
function openAdd(){
  if(!user){toast("Sign in first to add questions");signIn();return}
  reset();openModal();
}
function reset(){editId=null;$("q").value="";$("a").value="";$("n").value="";setImg("");$("mt").textContent="Add question";$("save").textContent="Add to notebook"}
$("fab").onclick=openAdd;
$("mx").onclick=function(){closeModal();reset()};
$("cancel").onclick=function(){closeModal();reset()};
$("ov").onmousedown=function(e){if(e.target===$("ov")){closeModal();reset()}};

/* add button hides while scrolling down, returns when scrolling up */
var lastY=0;
window.addEventListener("scroll",function(){
  var y=window.pageYOffset||0,f=$("fab");
  if(y<120||y<lastY-6)f.classList.remove("hide");
  else if(y>lastY+6)f.classList.add("hide");
  lastY=y;
},{passive:true});

$("save").onclick=function(){
  if(!user){toast("Sign in first to save notes");signIn();return}
  var q=$("q").value.trim();
  if(!q)q="/";
  var d={cat:$("cat").value,q:q,a:$("a").value.trim(),n:$("n").value.trim(),img:curImg},added=!editId;
  if(editId){var it=items.filter(function(x){return x.id===editId})[0];if(it){for(var k in d)it[k]=d[k];saveItem(it)}}
  else{d.review=true;d.love=false;d.ts=Date.now();d.id=d.ts.toString(36)+Math.random().toString(36).slice(2,6);items.unshift(d);saveItem(d);if(page!==1&&filter!=="Learned")page=1}
  closeModal();reset();render();
  toast(added?"Question added":"Changes saved");
};

/* ---------- images (saved inside the note itself, no Firebase Storage needed) ---------- */
function setImg(u){curImg=u;$("prev").innerHTML=u?'<div class="pv"><img src="'+esc(u)+'" alt=""><button type="button" id="rmimg">Remove image</button></div>':"";$("addimg").textContent=u?"Change image":"Add image"}
function shrink(f){return new Promise(function(res,rej){
  var fr=new FileReader();fr.onerror=rej;
  fr.onload=function(){var im=new Image();im.onerror=rej;
    im.onload=function(){
      var max=1000,q=.78,out="";
      for(var t=0;t<6;t++){
        var s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");
        c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));
        var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
        out=c.toDataURL("image/jpeg",q);
        if(out.length<600000)break;
        max=Math.round(max*.75);q=Math.max(.5,q-.08);
      }
      res(out);
    };
    im.src=fr.result;
  };
  fr.readAsDataURL(f);
})}
async function handleImage(f){
  if(!f)return;
  if(!user){toast("Sign in first");signIn();return}
  if(!/^image\//.test(f.type)){toast("That file is not an image");return}
  $("imgmsg").textContent="Preparing image...";
  try{setImg(await shrink(f));$("imgmsg").textContent=""}
  catch(e){$("imgmsg").textContent="Could not read this image."}
}
$("addimg").onclick=function(){if(!user){toast("Sign in first");signIn();return}$("imgfile").click()};
$("prev").onclick=function(e){if(e.target.id==="rmimg")setImg("")};
$("imgfile").onchange=function(){var f=this.files[0];this.value="";handleImage(f)};

/* Ctrl+V: paste a copied image anywhere in the popup (answer box included) */
$("ov").addEventListener("paste",function(e){
  var its=(e.clipboardData&&e.clipboardData.items)||[];
  for(var i=0;i<its.length;i++){
    if(its[i].kind==="file"&&its[i].type.indexOf("image/")===0){
      e.preventDefault();handleImage(its[i].getAsFile());toast("Image pasted");return;
    }
  }
});

drawAcct();render();
</script>
